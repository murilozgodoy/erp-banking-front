name: E2E

# Manual: roda o Playwright contra o front publicado (não faz parte do CI obrigatório).
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL do front a testar
        required: false
        default: https://erp-banking-front.vercel.app

jobs:
  e2e:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Run E2E
        run: npm run test:e2e
        env:
          BASE_URL: ${{ inputs.base_url }}
          # Opcional: secret com um JWT do Auth0 para os testes autenticados (sem ele, são pulados).
          E2E_ACCESS_TOKEN: ${{ secrets.E2E_ACCESS_TOKEN }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
