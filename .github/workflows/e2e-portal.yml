name: E2E portal

# Manual: roda o Playwright do portal do cliente contra o Vite local em modo mock (MSW + login simulado).
on:
  workflow_dispatch:

jobs:
  e2e-portal:
    name: Playwright portal (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E portal
        run: npm run test:e2e:portal

      # Sempre: os prints de cada passo da jornada servem para a apresentação, não só para depurar.
      - name: Upload screenshots e relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-e2e-screenshots
          path: |
            test-results/**/*.png
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-portal
          path: test-results/**/*.zip
          retention-days: 7
