<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ErpIa</title>
    <meta
      name="description"
      content="ErpIa — ERP com banking e crédito inteligente para empresas."
    />
    <meta name="theme-color" content="#0c110e" />
    <script>
      // Tema antes do primeiro paint (evita piscar): escolha salva ou a do sistema.
      try {
        const saved = localStorage.getItem('erpia-theme')
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
